      tags: [monitors]
      summary: "Append Monitor Version"
      description: "BE 36. Pause, resume, rebind or reschedule as a full new version (ScheduleCreateIn + expected_version). Appended under the tenant lock: a stale expected_version, or the loser of two concurrent appends, is 409 VERSION_CONFLICT. Nothing is updated in place; recorded occurrences are never regenerated -- a new version's first due instant is strictly after the last recorded one."
      security:
      - bearerAuth: []
      parameters:
        - name: investor_id
          in: path
          required: true
          schema: {"type": "string", "title": "Investor Id"}
        - name: schedule_id
          in: path
          required: true
          schema: {"type": "string", "format": "uuid", "title": "Schedule Id"}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {"type": "string", "format": "uuid"}
      requestBody:
        required: true
        description: "ScheduleVersionIn (ScheduleCreateIn + expected_version)."
      responses:
        '201':
          description: "Schedule (200 on idempotent replay)"
        '404':
          $ref: '#/components/responses/WorkspaceError'
        '409':
          $ref: '#/components/responses/WorkspaceError'
        '422':
          $ref: '#/components/responses/WorkspaceError'
        '503':
          description: "MONITORS_UNAVAILABLE (055 and 057 not installed), or WORKSPACE_WRITES_NOT_READY on writes"
  /investors/{investor_id}/workspace/monitors/{schedule_id}/runs:
    get:
      tags: [monitors]
      summary: "List Monitor Runs"
      description: "BE 36-37. Every recorded due occurrence, newest due first: disposition (BLOCKED_EXECUTION_POLICY, BLOCKED_EVENT, SUPERSEDED_THESIS; QUEUED only once BE 38 exists), blocked_reason, task_state, report_id, executed, recorded_late and display_state. Event occurrences carry the matched event (type, date, exact period, source). A blocked occurrence is never a completed run. Response: Page<Run>."
      security:
      - bearerAuth: []
      parameters:
        - name: investor_id
          in: path
          required: true
          schema: {"type": "string", "title": "Investor Id"}
        - name: schedule_id
          in: path
          required: true
          schema: {"type": "string", "format": "uuid", "title": "Schedule Id"}
        - name: cursor
          in: query
          required: false
          schema: {"type": "string"}
        - name: limit
          in: query
          required: false
          schema: {"type": "integer", "minimum": 1, "maximum": 100}
      responses:
        '200':
          description: "Page<Run>"
        '404':
          $ref: '#/components/responses/WorkspaceError'
        '409':
          $ref: '#/components/responses/WorkspaceError'
        '422':
          $ref: '#/components/responses/WorkspaceError'
        '503':
          description: "MONITORS_UNAVAILABLE (055 and 057 not installed), or WORKSPACE_WRITES_NOT_READY on writes"
    post:
      tags: [monitors]
      summary: "Request Monitor Run"
      description: "BE 36. Always 409 EXECUTION_POLICY_UNRESOLVED while BE-Q01 is open, after resolving the schedule (foreign/unknown is 404). Body ManualRunIn {schedule_version} -- no caller-supplied due time. Writes nothing."
      security:
      - bearerAuth: []
      parameters:
        - name: investor_id
          in: path
          required: true
          schema: {"type": "string", "title": "Investor Id"}
        - name: schedule_id
          in: path
          required: true
          schema: {"type": "string", "format": "uuid", "title": "Schedule Id"}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {"type": "string", "format": "uuid"}
      requestBody:
        required: true
        description: "ManualRunIn {schedule_version}."
      responses:
        '404':
          $ref: '#/components/responses/WorkspaceError'
        '409':
          $ref: '#/components/responses/WorkspaceError'
        '422':
          $ref: '#/components/responses/WorkspaceError'
        '503':
          description: "MONITORS_UNAVAILABLE (055 and 057 not installed), or WORKSPACE_WRITES_NOT_READY on writes"
  /investors/{investor_id}/workspace/monitor-runs/{run_id}:
    get:
