openapi: 3.1.0
info:
  title: Portfolio Intelligence API
  version: 0.1.0-mvp
  description: |
    THE STACK-AGNOSTIC CONTRACT.

    This file, plus schema/*.schema.json and fixtures/*.json, IS the system.
    Any language or framework honouring these and passing the fixtures is a
    valid implementation. Generate server stubs with openapi-generator.

    Two invariants the API must preserve:
      1. Holdings and performance are DERIVED on read. There is no PUT /holdings.
      2. Transactions are APPEND-ONLY. There is no PUT or DELETE on /transactions;
         corrections are new reversing rows via POST.

servers:
  - url: https://api.example.com/v1

tags:
  - name: onboarding
    description: Creating investors and accounts. Everything else needs one of these to exist first.
  - name: transactions
    description: The only writable ledger. Append-only.
  - name: derived
    description: Computed on every request. Never stored.
  - name: ingestion
    description: Adapters. Each converts a source into Transaction[] and stops.
  - name: ops
    description: Prices and reconciliation.
  - name: consent
    description: |
      DPDP consent-first (docs/COMPLIANCE.md). A live grant is required before
      POST /ingest/csv, POST /ingest/email or POST /investors/{id}/transactions will
      process anything for that investor -- see app.db.consent.require_consent.

paths:
  /investors:
    post:
      tags: [onboarding]
      summary: Onboard a new investor
      description: |
        The only way an investor row is created outside db/load_golden.py's fixture
        seed. `code` must be unique (docs/DATA_MODEL.md: "use this in files and logs,
        never the name or PAN").

        `pan` is optional and write-only: if supplied, it is hashed and encrypted into
        `investor_secret` via app.db.crypto and is never stored on this row or echoed
        back in any response, per CLAUDE.md's rule that PAN never lands on `investor`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, display_name]
              properties:
                code:
                  type: string
                  description: Unique short code, e.g. C002.
                display_name:
                  type: string
                family_group_id:
                  type: string
                  format: uuid
                  nullable: true
                pan:
                  type: string
                  description: Optional, write-only. Routed through app.db.crypto; never returned.
                onboarding_date:
                  type: string
                  format: date
                  nullable: true
                  description: |
                    When the advisory relationship with this client began. Optional.
                    Feeds compute_period_xirr's start_date (app/engine/xirr.py) via
                    GET /investors/{investor_id}/performance's period_xirr. Lives on
                    investor rather than account: account.is_advised already scopes
                    which trades count toward advisory performance, and performance
                    is computed per investor across all of their accounts.
      responses:
        '201':
          description: Investor created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  display_name: { type: string }
                  family_group_id: { type: string, format: uuid, nullable: true }
                  onboarding_date: { type: string, format: date, nullable: true }
                  created_at: { type: string, format: date-time }
        '400':
          description: pan does not match the mandated PAN format
        '409':
          description: code is already in use

  /investors/{investor_id}/accounts:
    post:
      tags: [onboarding]
      summary: Add a broker/demat account to an investor
      description: |
        One row per demat/broker account (docs/DATA_MODEL.md) -- a client's CAS
        routinely reveals accounts nobody knew existed, so onboarding must be able to
        add more than one per investor.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [broker]
              properties:
                broker:
                  type: string
                  description: "e.g. ZERODHA, GROWW, AXIS"
                dp_id: { type: string, nullable: true }
                client_id: { type: string, nullable: true }
                is_advised:
                  type: boolean
                  default: true
                  description: False = the client's own punting; excluded from advisory performance.
                label: { type: string, nullable: true }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  investor_id: { type: string, format: uuid }
                  broker: { type: string }
                  dp_id: { type: string, nullable: true }
                  client_id: { type: string, nullable: true }
                  is_advised: { type: boolean }
                  label: { type: string, nullable: true }
                  forwarding_addresses:
                    type: array
                    items: { type: string }
                    description: |
                      One address per (broker, doctype) pair with a working adapter
                      (app.ingest.webhook._ADAPTER_FACTORIES), computed from
                      INGEST_DOMAIN and the investor's code. Empty for a broker with
                      no adapter yet.
        '404':
          description: no investor with this id

  /investors/{investor_id}/consent:
    get:
      tags: [consent]
      summary: Check whether this investor has a live consent grant
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: purpose, in: query, required: false, schema: { type: string, default: PORTFOLIO_TRACKING } }
      responses:
        '200':
          description: Current consent status
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_live_consent: { type: boolean }
    post:
      tags: [consent]
      summary: Grant consent
      description: |
        Required before POST /ingest/csv, POST /ingest/email or
        POST /investors/{id}/transactions will process anything for this investor --
        app.db.consent.require_consent refuses with 403 otherwise. Never edits an
        existing row: a re-grant after withdrawal is always a new row, so the history
        of what was agreed, when, and under which notice_version survives intact.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notice_version, evidence_ref]
              properties:
                notice_version:
                  type: string
                  description: Which wording of the consent notice was agreed to (docs/COMPLIANCE.md §3).
                evidence_ref:
                  type: string
                  description: What proves the principal actually agreed -- an email message-id, a signed PDF path, or a UI-channel label for an in-app grant.
                purpose:
                  type: string
                  default: PORTFOLIO_TRACKING
                lawful_basis:
                  type: string
                  default: CONSENT
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  investor_id: { type: string, format: uuid }
                  notice_version: { type: string }
                  purpose: { type: string }
                  lawful_basis: { type: string }

  /investors/{investor_id}/consent/withdraw:
    post:
      tags: [consent]
      summary: Withdraw consent
      description: |
        Stamps withdrawn_at on every live consent row for this purpose -- takes effect
        immediately, per app.db.consent.withdraw_consent. Erasure of the underlying
        data is a separate right; see POST /privacy/erase.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: purpose, in: query, required: false, schema: { type: string, default: PORTFOLIO_TRACKING } }
      responses:
        '200':
          description: Withdrawal recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawn_count: { type: integer }

  /investors/{investor_id}/transactions:
    get:
      tags: [transactions]
      summary: List the ledger
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: isin,   in: query, schema: { type: string } }
        - { name: from,   in: query, schema: { type: string, format: date } }
        - { name: to,     in: query, schema: { type: string, format: date } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/transaction.schema.json' }
    post:
      tags: [transactions]
      summary: Append transactions (idempotent on dedupe_key)
      description: |
        Duplicates are SKIPPED, not errors. Returns counts so the caller can show
        an honest import summary. This endpoint backs manual entry, CSV import and
        the email webhook alike.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: 'https://mei.capital/schema/transaction.schema.json' }
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }
                  skipped_duplicates: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        reason: { type: string }

  /investors/{investor_id}/holdings:
    get:
      tags: [derived]
      summary: Current holdings, computed from the ledger
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: Historical replay. Defaults to today. }
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/holding.schema.json' }
        '409':
          description: MissingPriceError - one or more held ISINs have no usable price

  /investors/{investor_id}/performance:
    get:
      tags: [derived]
      summary: Both XIRR variants, TWRR, returns, benchmark
      description: |
        period_xirr (the adviser-onboarding case) and its period_start are resolved
        entirely server-side from the investor's stored onboarding_date (set via POST
        /investors) and a live market-value snapshot on that date -- there is no
        request parameter for it, deliberately: accepting a client-supplied opening
        value would be exactly the kind of stand-in fy_xirr already refuses to accept
        for its own opening value. Both come back null when onboarding_date is unset,
        is after as_of, or has no usable price.

        fy_twrr/twrr_1y/twrr_3y/twrr_5y sit beside their xirr counterparts, never
        replacing them (docs/ENGINE_SPEC.md section 5): TWRR chains sub-period returns
        across the persisted daily snapshot series between each window's start and
        as_of, removing the effect of when money was added so it measures the adviser,
        where XIRR measures the client's actual experience. No request parameter --
        same resolution as the xirr windows, independently null under the same
        conditions.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
        - name: benchmark
          in: query
          schema: { type: string, enum: [NIFTY50_TRI, SENSEX_TRI] }
          description: |
            Cash-flow-replicated index return (docs/ENGINE_SPEC.md section 6). Omitted
            entirely -- never computed by default -- unless supplied. NIFTY50_TRI is
            implemented (app.prices.index_sources, an NSE Indices TRI feed). SENSEX_TRI
            is a valid enum value with no reliable free, machine-fetchable TRI source
            behind it yet, so requesting it returns 400 rather than a null or guessed
            benchmark.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: 'https://mei.capital/schema/performance.schema.json' }
        '400':
          description: benchmark=SENSEX_TRI, which is declared but not yet implemented

  /investors/{investor_id}/snapshots:
    get:
      tags: [derived]
      summary: Persisted daily portfolio snapshots for a date range
      description: |
        Read-only range query over portfolio_snapshot (docs/ENGINE_SPEC.md section 8) --
        never a live compute_snapshot() replay across the range, which is the entire
        reason this table exists. Powers the Dashboard's historical portfolio-value
        chart (docs/trackr_plus_phase2_overview.md section 6). A date with no
        persisted row -- before backfill's earliest reachable date, or a gap from a run
        that hit MissingPriceError -- is simply absent from the returned array; the
        caller must render that as an honest gap, never interpolate between the
        surrounding points. advised_only selects the same independent series
        /performance and /ops/snapshots/run use.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/snapshot.schema.json' }
        '400':
          description: start is after end

  /investors/{investor_id}/lots:
    get:
      tags: [derived]
      summary: Open FIFO lots
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }

  /investors/{investor_id}/realised:
    get:
      tags: [derived]
      summary: Realised gains, FIFO-matched, short/long classified
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fy, in: query, schema: { type: string, examples: ["2025-26"] } }
      responses:
        '200': { description: OK }

  /investors/{investor_id}/dividends:
    get:
      tags: [derived]
      summary: Dividend income, per ISIN and per financial year
      description: |
        DIVIDEND is already a correct ledger row (docs/DATA_MODEL.md: qty=0, price=0,
        amount in dividend_amount) and already a positive XIRR cash flow
        (docs/ENGINE_SPEC.md section 4). This is the display aggregation over those same
        rows, not a new data source -- only ISINs with at least one DIVIDEND row appear.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/dividend.schema.json' }

  /ingest/csv:
    post:
      tags: [ingestion]
      summary: Upload one or more broker CSV/XLSX files
      description: |
        Multi-file by design. Console caps each tradebook download at 365 days, so a
        full history is several files. Merge and dedupe server-side.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                investor_id: { type: string, format: uuid }
                account_id:  { type: string, format: uuid }
                adapter:     { type: string, enum: [zerodha_tradebook, generic_csv] }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200': { description: Import summary }

  /ingest/email:
    post:
      tags: [ingestion]
      summary: Inbound email webhook (SendGrid / Mailgun / Postmark)
      description: |
        Routing is by the `to` address, NEVER by sniffing content. Address pattern:
        {investor_code}-{broker}-{doctype}@{INGEST_DOMAIN}, e.g.
        c001-zerodha-contractnote@ingest.example.com. INGEST_DOMAIN is the
        deployment's configured domain (app/config.py); POST
        /investors/{investor_id}/accounts returns each account's real addresses on
        `forwarding_addresses` rather than a client having to construct one by hand.

        Zerodha sends at least four document types from the same sender address, so
        content sniffing misclassifies. Address routing cannot.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to:      { type: string }
                from:    { type: string }
                subject: { type: string }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      filename:     { type: string }
                      content_type: { type: string }
                      content_b64:  { type: string }
      responses:
        '202': { description: Accepted for processing }

  /ops/prices/refresh:
    post:
      tags: [ops]
      summary: Fetch NSE + BSE bhavcopy and upsert prices
      description: |
        Runs daily ~18:30 IST. BOTH exchanges are mandatory - some SME/BSE-only
        scrips have no NSE symbol at all, and an unpriced holding makes XIRR
        uncomputable. Failure must alert, never silently serve stale prices.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices_stored: { type: integer }
                  missing_isins: { type: array, items: { type: string } }
                  price_date:    { type: string, format: date }

  /ops/snapshots/run:
    post:
      tags: [ops]
      summary: Persist daily portfolio-level snapshots (docs/ENGINE_SPEC.md section 8)
      description: |
        The only path that writes portfolio_snapshot -- a cache of compute_snapshot(),
        never a source of truth. No start/end -> both default to today, the cheap daily
        catch-up meant to run alongside /ops/prices/refresh. A wider range is a resumable
        historical backfill: missing bhavcopy is fetched first (clamped to whatever date
        the NSE archive actually serves), then one row per (investor, advised_only,
        trading day) is computed and upserted. advised_only gets its own series because
        GET /investors/{investor_id}/performance's advised_only parameter filters the
        ledger before computing anything, not the response after.
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots_written:  { type: integer }
                  price_dates_fetched: { type: integer }
                  skipped_missing_price:
                    type: array
                    items:
                      type: object
                      properties:
                        investor_id:  { type: string, format: uuid }
                        advised_only: { type: boolean }
                        as_of:        { type: string, format: date }
                        isins:        { type: array, items: { type: string } }

  /investors/{investor_id}/reconcile:
    post:
      tags: [ops]
      summary: Compare computed holdings against declared quantities
      description: |
        The corporate-action detector. Feed CAS or broker holdings quantities;
        any mismatch is a corporate action, off-market transfer, missed contract
        note, or bug.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                as_of:  { type: string, format: date }
                source: { type: string }
                holdings:
                  type: array
                  items:
                    type: object
                    properties:
                      isin:     { type: string }
                      quantity: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/discrepancy.schema.json' }
