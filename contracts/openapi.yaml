openapi: 3.1.0
info:
  title: Portfolio Intelligence API
  version: 0.1.0-mvp
  description: |
    THE STACK-AGNOSTIC CONTRACT.

    This file, plus schema/*.schema.json and fixtures/*.json, IS the system.
    Any language or framework honouring these and passing the fixtures is a
    valid implementation. Generate server stubs with openapi-generator.

    Two invariants the API must preserve:
      1. Holdings and performance are DERIVED on read. There is no PUT /holdings.
      2. Transactions are APPEND-ONLY. There is no PUT or DELETE on /transactions;
         corrections are new reversing rows via POST.

    A third, added with investor ownership (migration 015): every /investors/{id}
    scope authorises against investor.owner_user_id. A caller authenticated as one
    login gets 403 for an investor owned by another and 404 for one that does not
    exist; unowned rows are unreachable until claimed (app.db.assign_owner).

    A fourth, the ENCODING RULE: EVERY decimal in this API is a JSON STRING, in both
    directions. Money, quantities, rates and ratios alike -- see
    schema/transaction.schema.json#/$defs/decimal and #/$defs/nullableDecimal. Rates were
    JSON numbers until BE 02 and are not any more: a number is an IEEE double once a
    client parses it, so the XIRR this system exists to compute was the single value it
    rounded on the way out.

    On INGRESS the rule is strict, and a JSON number is REFUSED rather than coerced --
    including 0. Accepting the numbers that happen to be exactly representable would make
    the contract depend on the value instead of the type, and the ledger it writes to is
    append-only, so a value that arrives wrong stays wrong forever. Null keeps its
    established meaning of NOT AVAILABLE, wherever a field already permitted it, and is
    never interchangeable with zero.

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

tags:
  - name: onboarding
    description: Creating investors and accounts. Everything else needs one of these to exist first.
  - name: transactions
    description: The only writable ledger. Append-only.
  - name: derived
    description: Computed on every request. Never stored.
  - name: ingestion
    description: Adapters. Each converts a source into Transaction[] and stops.
  - name: ops
    description: Prices and reconciliation.
  - name: consent
    description: |
      DPDP consent-first (docs/COMPLIANCE.md). A live grant is required before
      POST /ingest/csv, POST /ingest/email or POST /investors/{id}/transactions will
      process anything for that investor -- see app.db.consent.require_consent.
  - name: auth
    description: |
      Login to this application. Product CAPABILITIES (`portfolio`, `workspace`) are
      separate from investor OWNERSHIP and never substitute for it -- see
      docs/PRODUCT_ARCHITECTURE.md section 4.

  - name: workspace
    description: |
      Workspace research -- companies, the question ritual, notes, questions/answers, Home,
      thesis versions/events and the human exit-trigger override (sessions 08-11, 15;
      BLUEPRINT_BACKEND.md 7.2). Every route needs a session, investor ownership, the
      `workspace` capability and an enabled, ready Workspace (503 WORKSPACE_DISABLED /
      WORKSPACE_UNAVAILABLE otherwise). WRITE routes also need recorded privacy decisions
      (503 WORKSPACE_WRITES_NOT_READY while BE-Q04/BE-Q05 are open) and a UUID
      `Idempotency-Key`: first success 201, exact retry 200 with the original result, same
      key with a different payload 409 IDEMPOTENCY_CONFLICT. Locked companies answer 409
      RITUAL_REQUIRED on every content route; GET /companies/{isin} returns identity only.
      Generated from the implementation (app/schemas/workspace.py) -- regenerate, do not
      hand-edit, when those DTOs change.
  - name: research
    description: |
      Sources and retained text (session 12), sourced facts (13) and evaluation receipts
      (15); BLUEPRINT_BACKEND.md 7.3. Same guards as `workspace`. The live metric registry
      and reporting calendar approve nothing (BE-Q03 open): live fact creation returns 422
      METRIC_NOT_APPROVED and live evaluations are UNKNOWN with METRIC_UNAVAILABLE or
      CALENDAR_UNKNOWN. Every live source use is UNDECIDED (BE-Q04) and answers 403
      SOURCE_USE_DENIED. Generated from app/schemas/research.py.
  - name: butler
    description: |
      Butler (BT 01-06; docs/BUTLER_ARCHITECTURE.md section 9). Workspace only -- Plus has no
      client for these paths. Same guards as `workspace`, plus 503 BUTLER_UNAVAILABLE until
      051_butler.sql is applied. Explicit follows and memory references, deterministic inbox
      cards rendered from reviewed templates at read time (WITHDRAWN with a fixed reason when
      cited evidence is retracted, forgotten, locked or not permitted), decision reviews that
      record the person's own answers with field-level states, source retractions, and a
      READ-class /context packet. No model is connected: no chat proxy, no submission route,
      `model_execution: NOT_CONNECTED`. Generated from app/schemas/butler.py.
paths:
  /auth/capabilities:
    get:
      tags: [auth]
      summary: Which products the calling login may use
      description: |
        EFFECTIVE capabilities for the authenticated caller, in stable order.
        `workspace` includes `portfolio`, so a login granted only Workspace reports
        both. A login with Plus only reports `["portfolio"]`.

        ALWAYS THE CALLER'S OWN. There is no user parameter and no administrative
        variant; this endpoint cannot report anyone else's access.

        Resolved from `user_capability` on every request, never from a token claim, so
        a revocation takes effect on the caller's next request rather than when their
        current token expires. Capabilities are deliberately absent from the JWT and
        from the login/refresh payloads, which are unchanged.

        THIS IS NOT AUTHORIZATION. A client uses it to decide what to render. Every
        research endpoint independently requires the `workspace` capability AND the
        existing investor-ownership check; a client that lies about this response
        gains a screen that fails on first use and nothing else.

        Workspace is granted only by an audited operator command
        (`python -m app.db.grant_capability`). No request header, Origin, email domain,
        signup payload or frontend build grants it.
      responses:
        '200':
          description: The caller's effective capabilities
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    description: Stable order; `portfolio` precedes `workspace`.
                    items:
                      type: string
                      enum: [portfolio, workspace]
              examples:
                plus:
                  summary: A Trackr+ login
                  value: { capabilities: [portfolio] }
                workspace:
                  summary: A Trackr Workspace login
                  value: { capabilities: [portfolio, workspace] }
        '401': { description: missing, malformed, expired or revoked bearer token }

  /investors:
    get:
      tags: [onboarding]
      summary: Every portfolio this login owns, oldest first
      description: |
        THE ENDPOINT THAT MAKES SWITCHING POSSIBLE. Creating a second investor has always
        worked, and POST /auth/login has always echoed back exactly one of them. With no
        way to enumerate the rest, a login owning two portfolios could reach the second
        only in the browser session that created it -- log out, log back in, and the
        session snapped to the first with the second unreachable from any screen. Nothing
        was ever lost; no endpoint would admit the rows were there.

        Scoped by ownership rather than by a path parameter, so there is no investor id
        to authorise: the query itself is the authorisation, and a login sees its own
        rows or an empty list. This is the one investor route without
        `require_owned_investor`.

        Ordered by `(created_at, id)` -- the same ordering
        `first_investor_id_for_user` uses -- so the first row here and the `investor_id`
        a login echoes back are always the same portfolio. They are only required to be
        consistent, never chronological: `created_at` defaults to `now()`, which is the
        transaction timestamp, so rows created in one transaction tie and break on uuid.
      responses:
        "200":
          description: The caller's portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    display_name: { type: string }
                    family_group_id: { type: string, nullable: true }
                    onboarding_date: { type: string, format: date, nullable: true }
                    created_at: { type: string, format: date-time }
        "401": { description: No session }
    post:
      tags: [onboarding]
      summary: Onboard a new investor
      description: |
        The only way an investor row is created outside db/load_golden.py's fixture
        seed. `code` must be unique (docs/DATA_MODEL.md: "use this in files and logs,
        never the name or PAN").

        `pan` is optional and write-only: if supplied, it is hashed and encrypted into
        `investor_secret` via app.db.crypto and is never stored on this row or echoed
        back in any response, per CLAUDE.md's rule that PAN never lands on `investor`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, display_name]
              properties:
                code:
                  type: string
                  description: Unique short code, e.g. C002.
                display_name:
                  type: string
                family_group_id:
                  type: string
                  format: uuid
                  nullable: true
                pan:
                  type: string
                  description: Optional, write-only. Routed through app.db.crypto; never returned.
                onboarding_date:
                  type: string
                  format: date
                  nullable: true
                  description: |
                    When the advisory relationship with this client began. Optional.
                    Feeds compute_period_xirr's start_date (app/engine/xirr.py) via
                    GET /investors/{investor_id}/performance's period_xirr. Lives on
                    investor rather than account: account.is_advised already scopes
                    which trades count toward advisory performance, and performance
                    is computed per investor across all of their accounts.
      responses:
        '201':
          description: Investor created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  display_name: { type: string }
                  family_group_id: { type: string, format: uuid, nullable: true }
                  onboarding_date: { type: string, format: date, nullable: true }
                  created_at: { type: string, format: date-time }
        '400':
          description: pan does not match the mandated PAN format
        '409':
          description: code is already in use

  /brokers:
    get:
      tags: [onboarding]
      summary: Every broker the UI may offer, with honest capability flags
      description: |
        THE ONE REGISTRY. Three screens used to hold their own idea of what a broker is
        -- the onboarding wizard hardcoded "ZERODHA", the Import screen hardcoded
        "Zerodha tradebook (CSV)", and the upload help named Zerodha Console. Each was
        right about Zerodha and silently wrong about everyone else. The backend is the
        only side that knows which adapters exist, so it is the only side that answers.

        EVERY CAPABILITY IS DERIVED SERVER-SIDE and none may be claimed optimistically:
        `documents` comes from the deterministic upload registry, `forwarding` from the
        email adapter registry AND this deployment's INGEST_DOMAIN, `pdf_password` by
        applying the broker's own password transform. A broker with `documents: []` is a
        valid, honest entry -- the account exists, files are accepted and classified,
        and forwarding is simply not offered. See app/brokers.py.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ordered by how common the broker is, not alphabetically
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string, description: "written verbatim into account.broker" }
                    name: { type: string }
                    documents:
                      type: array
                      items: { type: string }
                      description: |
                        Document kinds a deterministic adapter handles --
                        tradebook_csv, contract_note_pdf, ... Empty is a valid answer
                        and means "files accepted and classified, nothing parsed yet".
                    parses_contract_notes: { type: boolean }
                    parses_tradebooks: { type: boolean }
                    document_labels:
                      type: array
                      items: { type: string }
                      description: the same phrases a rejected upload uses
                    forwarding:
                      type: boolean
                      description: |
                        True only when this broker has an email adapter AND the
                        deployment has a mail-receiving domain. False means no address
                        exists to show -- never render one anyway.
                    email_adapter:
                      type: boolean
                      description: |
                        Whether an email adapter exists for this broker at all,
                        independent of the deployment's mail domain. Both halves of
                        `forwarding` are false at once on a deployment with no inbound
                        mail, so a client holding only `forwarding` cannot say whether a
                        missing address is our gap (no parser for this broker) or the
                        deployment's (no mail domain) -- and a UI that cannot tell them
                        apart has to hedge in a sentence that is half wrong either way.
                    pdf_password:
                      type: string
                      description: 'how this broker locks contract notes; "" when undocumented'
                    console_steps:
                      type: array
                      items: { type: string }
        '401': { description: missing/invalid bearer token }

  /investors/{investor_id}/forwarding-code:
    get:
      tags: [onboarding]
      summary: Gmail forwarding verification codes caught for this investor
      description: |
        Gmail refuses to forward to an address until a code it mails there is pasted
        back into Gmail's own settings. That message carries no attachment and holds the
        code in its BODY, so while the inbound webhook looked only at attachments the
        code was silently dropped and no client could finish setup -- forwarding was a
        screen, not a feature.

        The webhook now recognises it (`app/ingest/webhook.py`) and this hands it back to
        the only person who can use it. We show the code rather than following Gmail's
        confirmation link server-side: clicking it would mean granting a mail permission
        on someone's behalf, silently.

        An empty list is the normal answer almost always -- before a filter exists, and
        after a code ages out -- so it is 200, never 404. Codes older than 24 hours are
        omitted rather than shown stale.
      parameters:
        - name: investor_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Newest unexpired code per (broker, doctype)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    broker: { type: string }
                    doctype: { type: string }
                    code: { type: string }
                    received_at: { type: string, format: date-time }
        "403": { description: This investor belongs to another account }
        "404": { description: No such investor }

  /market/index-series:
    get:
      tags: [market]
      summary: Published closes for one index -- scoped to no investor
      description: |
        The market itself, for a dashboard whose ledger is empty.

        NOT a substitute for /investors/{id}/benchmark-series, which replicates THIS
        investor's cash flows into the index and dates each point to one of their
        snapshots (docs/ENGINE_SPEC.md section 6). With no snapshots that correctly
        returns nothing -- there are no cash flows to replicate. This is the published
        index and needs no ledger at all, which is what lets the value chart draw the
        half of itself that is real instead of a "no data" notice.

        Unscoped because an index close has no owner: no ISIN, no investor, and
        `index_level` has no foreign key into either. Authenticated for the same reason
        GET /brokers is -- data with no owner is still not data for the internet.

        Degrades to an empty `points` list rather than erroring when the upstream source
        is unreachable, matching benchmark-series: a chart decoration must not take a
        page down with it.
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
        - name: name
          in: query
          required: false
          description: |
            Defaults to NIFTY500_TRI, matching the dashboard's own benchmark default.
            SENSEX_TRI is a valid enum member with no adapter behind it and is refused
            with a 400 rather than answered with an empty series, which would read as a
            data gap rather than a missing source.
          schema:
            type: string
            enum: [NIFTY50_TRI, NIFTY500_TRI]
            default: NIFTY500_TRI
      responses:
        "200":
          description: Daily closes, ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        as_of: { type: string, format: date }
                        value:
                          type: string
                          description: Decimal string, never a float.
        "400":
          description: |
            Reversed range, a range wider than 25 years (this endpoint triggers an
            outbound fetch on a cache miss and must not become an open proxy), or an
            index with no data source.

  /investors/{investor_id}/onboarding:
    get:
      tags: [onboarding]
      summary: How far along this investor's setup is -- derived on read
      description: |
        THERE IS NO setup_complete COLUMN and there must never be one. Onboarding
        progress is derivable from rows the database already holds, so it is derived
        like everything else here (CLAUDE.md's one architectural rule). This endpoint
        replaces a localStorage key that lived in one browser -- the same account on a
        phone was offered the wizard again, and offered to create a second broker
        account with it.

        `complete` is `consent && accounts > 0 && transactions > 0`. Email forwarding is
        deliberately NOT part of it: plenty of people will upload a file once a quarter
        and never touch forwarding, and that is a finished setup rather than an
        abandoned one. `next_step` is the first fact that is false, so a client resumes
        rather than restarts.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Computed per request; nothing is stored
          content:
            application/json:
              schema:
                type: object
                required:
                  [terms_accepted, consent, accounts, transactions, forwarding_available,
                   complete, next_step]
                properties:
                  terms_accepted:
                    type: boolean
                    description: |
                      app_user.tos_version is set. False for accounts created before
                      that column existed -- never back-filled.
                  consent: { type: boolean, description: live DPDP consent }
                  accounts: { type: integer }
                  transactions: { type: integer }
                  forwarding_available:
                    type: boolean
                    description: |
                      This deployment can receive mail at all. When false a client omits
                      the forwarding step rather than showing a dead address.
                  complete: { type: boolean }
                  next_step:
                    type: string
                    nullable: true
                    enum: [permission, brokers, history, null]
        '401': { description: missing/invalid bearer token }
        '403': { description: investor not owned by this login }
        '404': { description: no investor with this id }

  /investors/{investor_id}/pan:
    put:
      tags: [onboarding]
      summary: Set or replace this investor's PAN after onboarding
      description: |
        POST /investors only accepts a PAN at creation time. This is the path for an
        investor who was onboarded before one was needed -- the Zerodha/Groww/Upstox
        contract-note password lookup depends on investor_secret carrying one.
        Write-only: never echoed back, same as InvestorIn.pan.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pan]
              properties:
                pan: { type: string }
      responses:
        '204':
          description: PAN stored (encrypted; never returned by any endpoint)
        '400':
          description: pan does not match the mandated PAN format
        '401': { description: missing/invalid bearer token }
        '403': { description: investor not owned by this login }

  /investors/{investor_id}/accounts:
    post:
      tags: [onboarding]
      summary: Add a broker/demat account to an investor
      description: |
        One row per demat/broker account (docs/DATA_MODEL.md) -- a client's CAS
        routinely reveals accounts nobody knew existed, so onboarding must be able to
        add more than one per investor.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [broker]
              properties:
                broker:
                  type: string
                  description: "e.g. ZERODHA, GROWW, AXIS"
                dp_id: { type: string, nullable: true }
                client_id: { type: string, nullable: true }
                is_advised:
                  type: boolean
                  default: true
                  description: False = the client's own punting; excluded from advisory performance.
                label: { type: string, nullable: true }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  investor_id: { type: string, format: uuid }
                  broker: { type: string }
                  dp_id: { type: string, nullable: true }
                  client_id: { type: string, nullable: true }
                  is_advised: { type: boolean }
                  label: { type: string, nullable: true }
                  forwarding_addresses:
                    type: array
                    items: { type: string }
                    description: |
                      One address per (broker, doctype) pair with a working adapter
                      (app.ingest.webhook._ADAPTER_FACTORIES), computed from
                      INGEST_DOMAIN and the investor's code. Empty for a broker with
                      no adapter yet.
        '404':
          description: no investor with this id

  /investors/{investor_id}/accounts:
    get:
      tags: [onboarding]
      summary: List the investor's broker accounts
      description: |
        Owner-scoped. Same shape as the POST response, forwarding addresses included.
        Exists so clients can offer an account PICKER instead of asking a human to
        paste an account UUID, and so an already-onboarded account is re-fetchable
        rather than cached client-side forever.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ordered by broker, then id
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    investor_id: { type: string, format: uuid }
                    broker: { type: string }
                    dp_id: { type: string, nullable: true }
                    client_id: { type: string, nullable: true }
                    is_advised: { type: boolean }
                    label: { type: string, nullable: true }
                    forwarding_addresses:
                      type: array
                      items: { type: string }
        '401': { description: missing/invalid bearer token }
        '403': { description: investor not owned by this login }

  /investors/{investor_id}/consent:
    get:
      tags: [consent]
      summary: Check whether this investor has a live consent grant
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: purpose, in: query, required: false, schema: { type: string, default: PORTFOLIO_TRACKING } }
      responses:
        '200':
          description: Current consent status
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_live_consent: { type: boolean }
    post:
      tags: [consent]
      summary: Grant consent
      description: |
        Required before POST /ingest/csv, POST /ingest/email or
        POST /investors/{id}/transactions will process anything for this investor --
        app.db.consent.require_consent refuses with 403 otherwise. Never edits an
        existing row: a re-grant after withdrawal is always a new row, so the history
        of what was agreed, when, and under which notice_version survives intact.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notice_version, evidence_ref]
              properties:
                notice_version:
                  type: string
                  description: Which wording of the consent notice was agreed to (docs/COMPLIANCE.md §3).
                evidence_ref:
                  type: string
                  description: What proves the principal actually agreed -- an email message-id, a signed PDF path, or a UI-channel label for an in-app grant.
                purpose:
                  type: string
                  default: PORTFOLIO_TRACKING
                lawful_basis:
                  type: string
                  default: CONSENT
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  investor_id: { type: string, format: uuid }
                  notice_version: { type: string }
                  purpose: { type: string }
                  lawful_basis: { type: string }

  /investors/{investor_id}/consent/withdraw:
    post:
      tags: [consent]
      summary: Withdraw consent
      description: |
        Stamps withdrawn_at on every live consent row for this purpose -- takes effect
        immediately, per app.db.consent.withdraw_consent. Erasure of the underlying
        data is a separate right; see POST /privacy/erase.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: purpose, in: query, required: false, schema: { type: string, default: PORTFOLIO_TRACKING } }
      responses:
        '200':
          description: Withdrawal recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawn_count: { type: integer }

  /investors/{investor_id}/transactions:
    get:
      tags: [transactions]
      summary: List the ledger
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: isin,   in: query, schema: { type: string } }
        - { name: from,   in: query, schema: { type: string, format: date } }
        - { name: to,     in: query, schema: { type: string, format: date } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/transaction.schema.json' }
    post:
      tags: [transactions]
      summary: Append transactions (idempotent on dedupe_key)
      description: |
        Duplicates are SKIPPED, not errors. Returns counts so the caller can show
        an honest import summary. This endpoint backs manual entry, CSV import and
        the email webhook alike.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: 'https://mei.capital/schema/transaction.schema.json' }
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }
                  skipped_duplicates: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        reason: { type: string }

  /investors/{investor_id}/holdings:
    get:
      tags: [derived]
      summary: Current holdings, computed from the ledger
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: Historical replay. Defaults to today. }
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/holding.schema.json' }
        '409':
          description: MissingPriceError - one or more held ISINs have no usable price

  /investors/{investor_id}/performance:
    get:
      tags: [derived]
      summary: Both XIRR variants, TWRR, returns, benchmark
      description: |
        period_xirr (the adviser-onboarding case) and its period_start are resolved
        entirely server-side from the investor's stored onboarding_date (set via POST
        /investors) and a live market-value snapshot on that date -- there is no
        request parameter for it, deliberately: accepting a client-supplied opening
        value would be exactly the kind of stand-in fy_xirr already refuses to accept
        for its own opening value. Both come back null when onboarding_date is unset,
        is after as_of, or has no usable price.

        fy_twrr/twrr_1y/twrr_3y/twrr_5y sit beside their xirr counterparts, never
        replacing them (docs/ENGINE_SPEC.md section 5): TWRR chains sub-period returns
        across the persisted daily snapshot series between each window's start and
        as_of, removing the effect of when money was added so it measures the adviser,
        where XIRR measures the client's actual experience. No request parameter --
        same resolution as the xirr windows, independently null under the same
        conditions.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
        - name: benchmark
          in: query
          schema: { type: string, enum: [NIFTY50_TRI, NIFTY500_TRI, SENSEX_TRI] }
          description: |
            Cash-flow-replicated index return (docs/ENGINE_SPEC.md section 6). Omitted
            entirely -- never computed by default -- unless supplied. NIFTY50_TRI and
            NIFTY500_TRI are implemented (app.prices.index_sources, an NSE Indices TRI
            feed). SENSEX_TRI is a valid enum value with no reliable free, machine-
            fetchable TRI source behind it yet, so requesting it returns 400 rather than
            a null or guessed benchmark.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: 'https://mei.capital/schema/performance.schema.json' }
        '400':
          description: benchmark=SENSEX_TRI, which is declared but not yet implemented

  /investors/{investor_id}/snapshots:
    get:
      tags: [derived]
      summary: Persisted daily portfolio snapshots for a date range
      description: |
        Read-only range query over portfolio_snapshot (docs/ENGINE_SPEC.md section 8) --
        never a live compute_snapshot() replay across the range, which is the entire
        reason this table exists. Powers the Dashboard's historical portfolio-value
        chart (docs/trackr_plus_phase2_overview.md section 6). A date with no
        persisted row -- before backfill's earliest reachable date, or a gap from a run
        that hit MissingPriceError -- is simply absent from the returned array; the
        caller must render that as an honest gap, never interpolate between the
        surrounding points. advised_only selects the same independent series
        /performance and /ops/snapshots/run use.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/snapshot.schema.json' }
        '400':
          description: start is after end

  /investors/{investor_id}/benchmark-series:
    get:
      tags: [derived]
      summary: The benchmark line for the Dashboard's portfolio-value chart
      description: |
        docs/ENGINE_SPEC.md section 6's cash-flow replication, valued at every persisted
        snapshot date in [start, end] instead of only at as_of. Points are dated to
        SNAPSHOT dates, not to every calendar day, so each lands on the same x-position
        as that snapshot's market value in /snapshots and the two lines can be read
        against each other honestly.

        Replication, NOT "rebase the index to invested cost on day one": a rebased line
        ignores every rupee contributed after the anchor, so a portfolio that simply kept
        saving would appear to beat the index for doing nothing. Because the replication
        buys index units on the days money actually arrived, the line starts at exactly
        the amount first contributed -- "rebased to your invested cost" falls out of it
        rather than needing a separate step.

        A snapshot date whose index level is missing has no point at all, rather than a
        null or a carried-forward one; the caller draws the gap, same convention as
        /snapshots. An unreachable index source returns 200 with an empty points array,
        never an error -- the chart's real subject, the portfolio's own value, comes from
        /snapshots and is already drawn.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
        - name: name
          in: query
          schema: { type: string, enum: [NIFTY50_TRI, NIFTY500_TRI, SENSEX_TRI], default: NIFTY500_TRI }
          description: |
            NIFTY 500 by default: a retail equity portfolio is rarely large-cap-only, and
            holding a mid- or small-cap book against a 50-stock index reads as skill (or
            failure) that is really just a difference in universe. NIFTY50_TRI remains the
            default for /performance's single-figure benchmark XIRR, a different question.
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [name, points]
                properties:
                  name: { type: string }
                  points:
                    type: array
                    items:
                      type: object
                      required: [as_of, value]
                      properties:
                        as_of: { type: string, format: date }
                        value: { type: string, description: Decimal as a string -- never a float. }
        '400':
          description: start is after end, or a benchmark name with no data source behind it

  /investors/{investor_id}/lots:
    get:
      tags: [derived]
      summary: Open FIFO lots
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }

  /investors/{investor_id}/realised:
    get:
      tags: [derived]
      summary: Realised gains, FIFO-matched, short/long classified
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fy, in: query, schema: { type: string, examples: ["2025-26"] } }
      responses:
        '200': { description: OK }

  /investors/{investor_id}/dividends:
    get:
      tags: [derived]
      summary: Dividend income, per ISIN and per financial year
      description: |
        DIVIDEND is already a correct ledger row (docs/DATA_MODEL.md: qty=0, price=0,
        amount in dividend_amount) and already a positive XIRR cash flow
        (docs/ENGINE_SPEC.md section 4). This is the display aggregation over those same
        rows, not a new data source -- only ISINs with at least one DIVIDEND row appear.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/dividend.schema.json' }

  /investors/{investor_id}/contribution:
    get:
      tags: [derived]
      summary: Which holdings contributed most to the portfolio's gain over a period
      description: |
        The first Intelligence-layer feature per docs/PRODUCT_VISION.md (docs/ENGINE_SPEC.md
        section 10): per-ISIN rupee attribution of the portfolio's total gain over
        (period_start, as_of]. Every ISIN held at period_start, held at as_of, or
        carrying a transaction dated in the window appears -- including a position
        fully exited during the window, so a holding dumped at a large loss mid-period
        cannot silently disappear from the list.

        gain = (end_value - start_value) - net_flow, the per-holding mirror of section
        5's TWRR flow adjustment, expressed as a rupee amount and not annualised.
        Dividends count toward gain (total-return convention, matching TWRR's
        Candidate B). pct_of_total is gain / total_gain, shown uncapped -- offsetting
        holdings can legitimately show percentages above 100% or below 0%, and this is
        never normalised away.

        period_start has no default the way fy_xirr's 1-April anchor does: the caller
        picks the window explicitly, same as /snapshots' start/end.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period_start, in: query, required: true, schema: { type: string, format: date } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: Defaults to today. }
        - { name: advised_only, in: query, schema: { type: boolean, default: false }, description: Restrict to accounts flagged is_advised. }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [as_of, period_start, total_gain, contributions]
                properties:
                  as_of: { type: string, format: date }
                  period_start: { type: string, format: date }
                  total_gain: { $ref: 'https://mei.capital/schema/transaction.schema.json#/$defs/decimal' }
                  contributions:
                    type: array
                    items: { $ref: 'https://mei.capital/schema/contribution.schema.json' }
        '400':
          description: period_start is after as_of
        '409':
          description: MissingPriceError - a held ISIN has no usable price at period_start or as_of

  /ingest/csv:
    post:
      tags: [ingestion]
      summary: Upload one or more broker CSV/XLSX files
      description: |
        Multi-file by design. Console caps each tradebook download at 365 days, so a
        full history is several files. Merge and dedupe server-side.

        Per-file, never all-or-nothing: a file whose sha256 was staged before comes
        back as its own entry naming the existing batch_id (notes say so), and the
        remaining files in the same request still stage. Only an investor-level refusal
        (401/403/consent) fails the request as a whole.

        VALIDATION IS THE ONE EXCEPTION, and it is all-or-nothing on purpose. Every file
        is checked against the declared `adapter` before anything stages -- by extension
        AND by content, so a contract note renamed `.csv` is refused here rather than
        parsed into rejections 200 rows later. A wrong file means the wrong things were
        picked, and half-importing the selection leaves the caller guessing which half;
        so a mismatch is a 422 naming every offending file, with nothing staged. Callers
        that want per-file routing instead of a declared slot should use POST
        /ingest/files.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                investor_id: { type: string, format: uuid }
                account_id:  { type: string, format: uuid }
                adapter:     { type: string, enum: [zerodha_tradebook, generic_csv] }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '202':
          description: One staging result per file, in upload order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [batch_id, parsed, rejected, sha256, document_id, notes]
                  properties:
                    # Null when the file was refused before any batch existed: the
                    # document named a PAN or client code that is not this account's
                    # (docs/INGESTION.md, "Tenant isolation"). Nothing was staged and
                    # nothing was stored; `notes` carries the redacted reason.
                    batch_id:    { type: string, format: uuid, nullable: true }
                    parsed:      { type: integer }
                    rejected:    { type: integer }
                    sha256:      { type: string }
                    document_id: { type: string, format: uuid, nullable: true }
                    notes:       { type: array, items: { type: string } }
        '401': { description: missing/invalid bearer token }
        '403': { description: investor not owned by this login }
        '422':
          description: |
            Unknown adapter, or one or more files failed validation -- `detail` names
            each offending file and what to do about it. Nothing staged.

  /ingest/files:
    post:
      tags: [ingestion]
      summary: Upload a mixed set of broker files and let the server route each one
      description: |
        The onboarding path. Unlike /ingest/csv and /ingest/xlsx, no `adapter` is
        declared: each file is classified by its contents and sent to the adapter that
        can read it. A first-time user has a downloads folder, not a taxonomy.

        TWO TIERS OF CHECK, both server-side:
          * extension -- `.pdf`, `.csv`, `.xlsx` and nothing else;
          * content -- magic bytes for the container, then structure for the document
            (a CSV's header row, a workbook's sheet names, a PDF's first page). This is
            what separates a tradebook from a contract note from a CAS, and what catches
            a file whose name does not match its bytes.

        PER-FILE OUTCOMES. One unreadable file never fails the request: it comes back
        with `ok: false` plus `reason` (what is wrong) and `hint` (what to do instead),
        and every other file still stages. A duplicate is `ok: true` naming its existing
        batch.

        STAGING ONLY. Nothing reaches the ledger here. Promote the returned
        `staged_batch_ids` with POST /ingest/stage/{batch_id}/promote -- routing files
        automatically is a convenience, committing them automatically is not.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                investor_id: { type: string, format: uuid }
                account_id:  { type: string, format: uuid }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '202':
          description: One outcome per file, in upload order, plus the batches ready to promote
          content:
            application/json:
              schema:
                type: object
                required: [files, accepted, rejected, staged_batch_ids]
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
                  staged_batch_ids:
                    type: array
                    items: { type: string, format: uuid }
                  files:
                    type: array
                    items:
                      type: object
                      required: [filename, ok, container, document]
                      properties:
                        filename:  { type: string }
                        ok:        { type: boolean }
                        container:
                          type: string
                          description: What the bytes are, from magic numbers -- never from the extension.
                          enum: [pdf, xlsx, xls, zip, text, binary, empty]
                        document:
                          type: string
                          description: What the document is, from its structure.
                          enum:
                            - tradebook_csv
                            - tradebook_xlsx
                            - contract_note_csv
                            - contract_note_xlsx
                            - contract_note_pdf
                            - cas_pdf
                            - unknown
                        adapter:   { type: string, nullable: true }
                        batch_id:  { type: string, format: uuid, nullable: true }
                        parsed:    { type: integer }
                        rejected:  { type: integer }
                        reason:    { type: string, nullable: true, description: What is wrong, in one sentence. }
                        hint:      { type: string, nullable: true, description: What to do instead, in one sentence. }
                        encrypted: { type: boolean, description: A PDF we could not unlock. The fix is a PAN, not another file. }
                        notes:     { type: array, items: { type: string } }
        '401': { description: missing/invalid bearer token }
        '403': { description: investor not owned by this login, or no live consent }
        '404': { description: account does not belong to this investor }

  /ingest/batches:
    get:
      tags: [ingestion]
      summary: List one investor's batches -- how a batch id stays findable
      description: |
        Owner-scoped like every /investors/{id} scope. Defaults to STAGED because that
        is the state a reviewer needs back; pass status=null to list everything.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: investor_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [STAGED, PROMOTED, DISCARDED], default: STAGED } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [batch_id, adapter, status, row_count, rejected_count, uploaded_at]
                  properties:
                    batch_id:       { type: string, format: uuid }
                    filename:       { type: string, nullable: true }
                    adapter:        { type: string }
                    status:         { type: string }
                    row_count:      { type: integer }
                    rejected_count: { type: integer }
                    uploaded_at:    { type: string, format: date-time }
        '401': { description: missing/invalid bearer token }
        '403': { description: investor not owned by this login }

  /ingest/email:
    post:
      tags: [ingestion]
      summary: Inbound email webhook (SendGrid / Mailgun / Postmark)
      description: |
        Routing is by the `to` address, NEVER by sniffing content. Address pattern:
        {investor_code}-{broker}-{doctype}@{INGEST_DOMAIN}, e.g.
        c001-zerodha-contractnote@ingest.example.com. INGEST_DOMAIN is the
        deployment's configured domain (app/config.py); POST
        /investors/{investor_id}/accounts returns each account's real addresses on
        `forwarding_addresses` rather than a client having to construct one by hand.

        Zerodha sends at least four document types from the same sender address, so
        content sniffing misclassifies. Address routing cannot.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to:      { type: string }
                from:    { type: string }
                subject: { type: string }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      filename:     { type: string }
                      content_type: { type: string }
                      content_b64:  { type: string }
      responses:
        '202': { description: Accepted for processing }

  /ops/prices/refresh:
    post:
      tags: [ops]
      summary: Fetch NSE + BSE bhavcopy and upsert prices, and refresh NIFTY TRI levels
      description: |
        Runs daily ~18:30 IST. BOTH exchanges are mandatory - some SME/BSE-only
        scrips have no NSE symbol at all, and an unpriced holding makes XIRR
        uncomputable. Failure must alert, never silently serve stale prices.

        The same run refreshes index_level for every fetchable TRI series over a short
        trailing window, so the dashboard's benchmark line reads rows that are already
        stored instead of making an uncached external call on a page load. That part is
        best-effort and reported, never raised: a TRI source being down leaves the
        benchmark line stale, which must not fail the job that keeps every valuation in
        the product correct.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices_stored: { type: integer }
                  missing_isins: { type: array, items: { type: string } }
                  price_date:    { type: string, format: date }
                  index_levels_stored:
                    type: object
                    description: |
                      Rows upserted per TRI series, keyed by index_level.index_name. A
                      series whose fetch failed is ABSENT rather than zero: nothing was
                      stored and nothing is known, which is not the same as the source
                      having had no new rows.
                    additionalProperties: { type: integer }
                  index_failures:
                    type: object
                    description: |
                      Series whose fetch or parse failed this run, with the reason.
                      Non-empty is the signal to go and look.
                    additionalProperties: { type: string }

  /ops/snapshots/run:
    post:
      tags: [ops]
      summary: Persist daily portfolio-level snapshots (docs/ENGINE_SPEC.md section 8)
      description: |
        The only path that writes portfolio_snapshot -- a cache of compute_snapshot(),
        never a source of truth. No start/end -> both default to today, the cheap daily
        catch-up meant to run alongside /ops/prices/refresh. A wider range is a resumable
        historical backfill: missing bhavcopy is fetched first (clamped to whatever date
        the NSE archive actually serves), then one row per (investor, advised_only,
        trading day) is computed and upserted. advised_only gets its own series because
        GET /investors/{investor_id}/performance's advised_only parameter filters the
        ledger before computing anything, not the response after.
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots_written:  { type: integer }
                  price_dates_fetched: { type: integer }
                  skipped_missing_price:
                    type: array
                    items:
                      type: object
                      properties:
                        investor_id:  { type: string, format: uuid }
                        advised_only: { type: boolean }
                        as_of:        { type: string, format: date }
                        isins:        { type: array, items: { type: string } }

  /investors/{investor_id}/reconcile:
    post:
      tags: [ops]
      summary: Compare computed holdings against declared quantities
      description: |
        The corporate-action detector. Feed CAS or broker holdings quantities;
        any mismatch is a corporate action, off-market transfer, missed contract
        note, or bug.
      parameters:
        - { name: investor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                as_of:  { type: string, format: date }
                source: { type: string }
                holdings:
                  type: array
                  items:
                    type: object
                    properties:
                      isin:     { type: string, pattern: '^IN[A-Z0-9]{10}$' }
                      quantity:
                        $ref: 'https://mei.capital/schema/transaction.schema.json#/$defs/decimal'
                        description: |
                          Exact decimal STRING, never a JSON number -- this is the value
                          the ledger is being checked against, so a float here would
                          manufacture the very drift the comparison exists to find.
                          Never negative: a statement does not declare a short position.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'https://mei.capital/schema/discrepancy.schema.json' }

  /investors/{investor_id}/workspace/companies:
    get:
      tags:
      - workspace
      summary: List Companies
      operationId: list_companies_investors__investor_id__workspace_companies_get
      security:
      - bearerAuth: []
      parameters:
      - name: investor_id
        in: path
        required: true
        schema:
          type: string
          title: Investor Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_CompanyListItem_'
        '422':
          $ref: '#/components/responses/WorkspaceError'
        '401':
          $ref: '#/components/responses/WorkspaceError'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceError'
        '409':
          $ref: '#/components/responses/WorkspaceError'
        '413':
          $ref: '#/components/responses/WorkspaceError'
        '503':
          $ref: '#/components/responses/WorkspaceError'
    post:
      tags:
      - workspace
      summary: Link Company
      operationId: link_company_investors__investor_id__workspace_companies_post
      security:
      - bearerAuth: []
      parameters:
      - name: investor_id
        in: path
        required: true
        schema:
          type: string
          title: Investor Id
      - name: Idempotency-Key
        in: header
        required: false
