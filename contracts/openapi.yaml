  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Issued by POST /auth/register and POST /auth/login. The response's
        `investor_id` is the caller's active investor; clients take it from there and
        never from a shared default.

        The token carries identity only. It carries no product capability and no
        ownership claim: both are resolved from the database on every request, so a
        revoked grant or a reassigned investor takes effect immediately rather than at
        token expiry. See GET /auth/capabilities.
