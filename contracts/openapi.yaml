                FACT_VALUE_INVALID, SECRET_LIKE_CONTENT, COMMITMENT_CONFLICT,
                NO_COMMITMENT_IN_FORCE, EVALUATION_NOT_TRIGGERED, EVALUATION_STALE,
                WORKSPACE_DISABLED, WORKSPACE_UNAVAILABLE, WORKSPACE_WRITES_NOT_READY.
            message: { type: string, description: Human-readable; not a stable identifier. }
            fields:
              type: object
              description: Input field -> short reason code, for attaching errors to controls.
