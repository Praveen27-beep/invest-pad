      description: "BE 29. One bounded retrieval through one APPROVED adapter ({adapter_id, periods<=10}), stored append-only: sources with origin, publication and retrieval dates, content hash; extracted facts and events UNVERIFIED; a repeat refresh is a no-op; a revised document from the same origin appends and supersedes within that origin only. No adapter is approved (BE-Q04), so a live call is 403 SOURCE_NOT_APPROVED before any fetch. Never touches financial ingestion or the ledger."
