components:
  responses:
    WorkspaceError:
      description: |
        The research-route error envelope (BLUEPRINT_BACKEND.md 7.1). Clients branch on
        `detail.code`. Request-body validation failures that FastAPI rejects before the
        handler runs keep FastAPI's standard 422 list shape.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceErrorEnvelope' }
          example:
            detail:
              code: RITUAL_REQUIRED
              message: record your own questions for this company before opening its research
              fields: {}
              request_id: 95147c64-6a37-4e4a-be06-d6d2b85a5d8b
    WorkspaceForbidden:
      description: |
        403: another account's investor (existing ownership behaviour), the
        `workspace_capability_required` capability refusal, or SOURCE_USE_DENIED for a
        source type with no recorded BE-Q04 verdict.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/WorkspaceErrorEnvelope' }
              - type: object
                properties:
                  detail: { type: string }
                  code: { type: string }
                  request_id: { type: [string, 'null'] }
    WorkspaceCapabilityRequired:
      description: |
        Authenticated, but this login does not hold the `workspace` capability.

        Every Workspace research route references this. 403 and not 401: the caller is
        who they say they are, so signing in again fixes nothing. 403 and not 404: the
        route exists, and hiding it would make a routing bug indistinguishable from a
        downgrade.

        Clients branch on `code`, never on `detail` -- the sentence is free to improve.
      content:
        application/json:
          schema:
            type: object
            required: [detail, code]
            properties:
              detail:
                type: string
                description: Human-readable; not a stable identifier.
              code:
                type: string
                enum: [workspace_capability_required]
                description: The stable identifier clients branch on.
              request_id:
                type: [string, 'null']
          example:
            detail: this account does not have Trackr Workspace access
            code: workspace_capability_required
            request_id: 95147c64-6a37-4e4a-be06-d6d2b85a5d8b

