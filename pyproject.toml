[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-intelligence"
version = "0.1.0"
description = "Portfolio intelligence platform for Indian investors. Everything derives from transactions."
requires-python = ">=3.11"

# No runtime source lives at the repo root any more -- engine/, db/, ingest/, storage/
# and prices/ relocated to trackr-backend/app/ (see docs/structure_revamp_plan.md) and
# api/ was retired in the same move. This project now exists to run tests/ against that
# package: `make install` installs both this file's dev extra AND trackr-backend's own
# dependencies into the one shared .venv. Package-specific dependencies (pyxirr, fastapi,
# psycopg, boto3, ...) live in trackr-backend/pyproject.toml, not here, so there is one
# place that declares each.

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["trackr-backend", "."]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "db: needs a real Postgres cluster; skipped when the binaries are absent",
  "network: reaches the live exchanges; skipped by default, run with -m network",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
]
