<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invest-pad notepad</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <section id="setup" hidden>
    <h1>Connect to Invest-pad</h1>
    <p>In Invest-pad, open <strong>Settings</strong>, create an extension token, and paste it here.</p>
    <label>Invest-pad address <input id="server" type="text" placeholder="http://localhost:3000"></label>
    <label>Extension token <input id="token" type="password" placeholder="ipx_…" autocomplete="off"></label>
    <button id="connect" class="primary">Connect</button>
    <p id="setup-status" role="status"></p>
  </section>

  <section id="pad" hidden>
    <div class="kinds" role="radiogroup" aria-label="What are you saving?">
      <label><input type="radio" name="kind" value="note" checked> Note</label>
      <label><input type="radio" name="kind" value="question"> Question</label>
    </div>
    <textarea id="body" rows="7" placeholder="Write a note…" aria-label="Your note or question"></textarea>

    <div id="context" hidden>
      <blockquote id="selection" hidden></blockquote>
      <p id="page"></p>
      <button id="drop-context" class="link">Don’t attach this page</button>
    </div>

    <label>Company <select id="subject"><option value="">Decide later</option></select></label>
    <button id="save" class="primary">Save to inbox <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
    <p id="status" role="status"></p>
    <p class="foot"><button id="disconnect" class="link">Disconnect</button></p>
  </section>
  <script type="module" src="panel.js"></script>
</body>
</html>
